# Render Blueprint de ClipLive: crea la web y el worker de una vez (Render → New → Blueprint).
# Guía paso a paso: cliplive-proyecto (1)/DEPLOY-RENDER.md
# Las claves (sync: false) se piden en el panel de Render al crear el Blueprint: nunca van en GitHub.

services:
  # ── La web: páginas, login y API ──
  - type: web
    name: cliplive-web
    runtime: node
    plan: starter            # $7/mes. El plan gratis se "duerme" tras 15 min sin visitas.
    region: virginia         # EE. UU. costa este: lo más cercano a República Dominicana y a Supabase
    # Render no admite espacios ni paréntesis en rootDir, así que se entra en la carpeta con cd.
    buildCommand: 'cd "cliplive-proyecto (1)" && npm ci && bash scripts/render-setup.sh web && npm run build'
    startCommand: 'cd "cliplive-proyecto (1)" && PATH="$PWD/bin:$PATH" npm run start'
    autoDeploy: true          # cada vez que subes a GitHub (rama main) se actualiza sola
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_URL          # tu dominio, p. ej. https://cliplive.app
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: clips
      - key: ADMIN_USERS
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_LOGIN
        value: "false"
      # Pagos (se pueden dejar vacíos hasta conectar Stripe/Tilopay)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false

  # ── El worker: descargas, recortes, encuadre y subtítulos (toma los trabajos de Supabase) ──
  - type: worker
    name: cliplive-worker
    runtime: node
    plan: standard           # $25/mes, 2 GB de RAM: lo mínimo para Whisper y la detección de caras
    region: virginia
    buildCommand: 'cd "cliplive-proyecto (1)" && npm ci && bash scripts/render-setup.sh worker'
    startCommand: 'cd "cliplive-proyecto (1)" && PATH="$PWD/bin:$PATH" node worker/index.mjs'
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: clips
      - key: WORKER_CONCURRENCY      # 1 en el plan Standard (1 CPU). Súbelo si pasas a un plan con más CPU.
        value: "1"
